<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>GustoGrid — Your Kitchen, On a Grid</title>
<meta name="description" content="Browse 280+ dishes, cook with smart timers, scale portions live, match recipes to what's in your fridge.">

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FF6B35">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GustoGrid">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.png">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Shared theme -->
<link rel="stylesheet" href="./theme.css">

<style>
  /* ============================================================
     HOME DASHBOARD — page-specific styles
     ============================================================ */

  .h-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 20px;
  }

  .greeting .eyebrow-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .greeting .dot {
    width: 6px; height: 6px;
    background: var(--mint);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--mint);
  }
  .greeting .small {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .greeting .name {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text);
    margin: 0;
  }
  .greeting .name em {
    font-style: italic;
    background: linear-gradient(135deg, #FF6B35, #FFC233);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .avatar {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, #FF6B35, #FFC233);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 18px;
    color: #1a0d05;
    position: relative;
    box-shadow: 0 4px 16px -4px rgba(255, 107, 53, 0.5);
  }
  .avatar::after {
    content: '';
    position: absolute;
    bottom: -2px; right: -2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--mint);
    border: 2px solid var(--bg);
  }

  /* Search bar */
  .search-bar {
    margin: 0 24px 24px;
    height: 54px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 12px;
    cursor: pointer;
  }
  .search-bar svg { color: var(--text-3); width: 18px; height: 18px; flex-shrink: 0; }
  .search-bar .placeholder { color: var(--text-3); font-size: 14px; flex: 1; }
  .search-bar .mic {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, rgba(255, 107, 53, 0.15), rgba(255, 194, 51, 0.1));
    border: 1px solid rgba(255, 107, 53, 0.3);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .search-bar .mic svg { color: var(--orange); width: 14px; height: 14px; }

  /* Fridge hero card */
  .fridge-hero {
    display: block;
    margin: 0 24px 32px;
    border-radius: 28px;
    background: linear-gradient(135deg, #FF6B35 0%, #E8A53D 50%, #FFC233 100%);
    padding: 24px;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 16px 40px -16px rgba(255, 107, 53, 0.6);
  }
  .fridge-hero:active { transform: scale(0.97); }
  .fridge-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 40%),
      radial-gradient(circle at 15% 80%, rgba(0, 0, 0, 0.12) 0%, transparent 50%);
    pointer-events: none;
  }
  .fridge-hero-row { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
  .fridge-hero-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(26, 13, 5, 0.7);
    margin-bottom: 6px;
  }
  .fridge-hero-title {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 400;
    line-height: 1.05;
    color: #1a0d05;
    letter-spacing: -0.02em;
    max-width: 220px;
    margin: 0;
  }
  .fridge-hero-title em { font-style: italic; }
  .fridge-hero-sub {
    color: rgba(26, 13, 5, 0.7);
    font-size: 13px;
    margin-top: 8px;
    max-width: 240px;
    line-height: 1.4;
  }
  .fridge-hero-cta {
    width: 52px; height: 52px;
    background: rgba(26, 13, 5, 0.9);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .fridge-hero-cta svg { color: #FFC233; width: 22px; height: 22px; }

  .hero-stat-row {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    position: relative;
    z-index: 1;
  }
  .hero-stat {
    flex: 1;
    background: rgba(26, 13, 5, 0.18);
    border-radius: 12px;
    padding: 10px 12px;
    backdrop-filter: blur(4px);
  }
  .hero-stat .v {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    color: #1a0d05;
    letter-spacing: -0.01em;
  }
  .hero-stat .l {
    font-size: 10px;
    color: rgba(26, 13, 5, 0.65);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* Section heading */
  .section-head {
    padding: 0 24px;
    margin-bottom: 16px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .section-head .title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text);
    margin: 0;
  }
  .section-head .title em { font-style: italic; color: var(--orange); }
  .section-head .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.1em;
  }

  /* Category grid */
  .cat-grid {
    padding: 0 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .cat-card {
    aspect-ratio: 0.92;
    border-radius: 24px;
    padding: 18px 16px 16px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
  }
  .cat-card:active { transform: scale(0.96); }
  .cat-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(0, 0, 0, 0.35));
    pointer-events: none;
    z-index: 0;
  }

  .cat-card .glyph {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.18);
    position: relative;
    z-index: 1;
  }
  .cat-card .glyph svg { width: 22px; height: 22px; color: white; }

  .cat-card .meta { position: relative; z-index: 1; }
  .cat-card .meta .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .cat-card .meta .name {
    font-family: 'Fraunces', serif;
    font-size: 21px;
    font-weight: 400;
    line-height: 1.05;
    color: white;
    letter-spacing: -0.02em;
  }
  .cat-card .meta .tag {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.65);
    margin-top: 6px;
    font-weight: 500;
  }

  /* Per-category palettes */
  .c-veg { background: linear-gradient(135deg, #1F4D2E 0%, #3DDC97 100%); }
  .c-non { background: linear-gradient(135deg, #4D1F26 0%, #FF3D5A 100%); }
  .c-con { background: linear-gradient(135deg, #4D3D1F 0%, #E8A53D 100%); }
  .c-chi { background: linear-gradient(135deg, #4D1F1F 0%, #FF6B35 100%); }
  .c-des { background: linear-gradient(135deg, #3D1F4D 0%, #FF6FB5 100%); }
  .c-sna { background: linear-gradient(135deg, #4D421F 0%, #FFC233 100%); }
  .c-dri { background: linear-gradient(135deg, #1F3D4D 0%, #4DD4FF 100%); }

  /* My Creations special card */
  .creations-card {
    grid-column: span 2;
    background: var(--surface);
    border: 1.5px dashed rgba(255, 107, 53, 0.35);
    border-radius: 24px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 18px;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s;
    text-decoration: none;
    color: inherit;
  }
  .creations-card:active { transform: scale(0.98); }
  .creations-card::before {
    content: '';
    position: absolute;
    top: -50%; right: -20%;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255, 107, 53, 0.15), transparent 70%);
    pointer-events: none;
  }

  .creations-glyph {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #FF6B35, #FFC233);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px -8px rgba(255, 107, 53, 0.5);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .creations-glyph svg { width: 26px; height: 26px; color: #1a0d05; stroke-width: 2.5; }

  .creations-body { flex: 1; position: relative; z-index: 1; }
  .creations-body .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--orange);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .creations-body .ttl {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .creations-body .ttl em { font-style: italic; }
  .creations-body .sub {
    font-size: 12px;
    color: var(--text-2);
    margin-top: 4px;
  }
  .creations-arrow {
    width: 36px; height: 36px;
    background: var(--surface-2);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .creations-arrow svg { width: 16px; height: 16px; color: var(--orange); }

  /* Install prompt */
  .install-prompt {
    position: fixed;
    bottom: calc(100px + var(--safe-bottom));
    left: 16px;
    right: 16px;
    max-width: 448px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid rgba(255, 107, 53, 0.3);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 99;
    box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.6);
    animation: fade-up 0.4s ease both;
  }
  .install-prompt-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #FF6B35, #FFC233);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .install-prompt-icon svg { color: #1a0d05; width: 18px; height: 18px; }
  .install-prompt-text { flex: 1; min-width: 0; }
  .install-prompt-text .a {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .install-prompt-text .b {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 2px;
  }
  .install-prompt-btn {
    padding: 8px 14px;
    background: linear-gradient(135deg, #FF6B35, #E8A53D);
    border: none;
    border-radius: 10px;
    color: #1a0d05;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Geist', sans-serif;
  }
  .install-prompt-close {
    width: 28px; height: 28px;
    background: var(--surface-2);
    border: none;
    border-radius: 8px;
    color: var(--text-3);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .install-prompt-close svg { width: 14px; height: 14px; }

  /* ============================================================
     SEARCH OVERLAY
     ============================================================ */
  .search-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 7, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 200;
    display: flex;
    flex-direction: column;
    animation: search-fade 0.2s ease-out;
  }
  @keyframes search-fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .search-panel {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding-top: calc(20px + var(--safe-top));
  }
  .search-input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .search-input-row svg { width: 20px; height: 20px; flex-shrink: 0; }
  .search-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Geist', sans-serif;
    font-size: 16px;
    font-weight: 400;
    padding: 8px 0;
    -webkit-appearance: none;
  }
  .search-input::placeholder { color: var(--text-3); }
  .search-close {
    width: 32px; height: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .search-close svg { width: 14px; height: 14px; color: var(--text-2); }

  .search-results {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px calc(40px + var(--safe-bottom));
  }
  .search-hint {
    padding: 60px 24px;
    text-align: center;
  }
  .search-hint p {
    margin: 0 0 8px;
    color: var(--text-2);
    font-size: 14px;
  }
  .search-hint .search-hint-sub {
    font-size: 13px;
    color: var(--text-3);
  }
  .search-hint em {
    font-style: normal;
    background: var(--surface-2);
    border-radius: 6px;
    padding: 2px 8px;
    color: var(--orange);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    margin: 0 2px;
  }

  .search-result-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 8px 12px;
  }
  .search-result {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s;
  }
  .search-result:hover { background: var(--surface); }
  .search-result:active { background: var(--surface-2); }
  .sr-thumb {
    width: 52px; height: 52px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .sr-thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), transparent 50%),
      radial-gradient(circle at 70% 80%, rgba(0,0,0,0.2), transparent 50%);
  }
  .sr-em {
    font-size: 26px;
    line-height: 1;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    z-index: 1;
  }
  .sr-body { flex: 1; min-width: 0; }
  .sr-title {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
    letter-spacing: -0.01em;
  }
  .sr-sub {
    font-size: 11px;
    color: var(--text-2);
    margin-bottom: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sr-meta { display: flex; gap: 5px; flex-wrap: wrap; }
  .sr-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-3);
    background: var(--surface-2);
    padding: 2px 6px;
    border-radius: 5px;
    letter-spacing: 0.04em;
  }
  .sr-pill.diff-Easy { color: var(--mint); }
  .sr-pill.diff-Medium { color: var(--amber); }
  .sr-pill.diff-Hard { color: var(--crimson); }
</style>
</head>

<body>

<!-- Loading skeleton -->
<div id="app-loading" class="app-loading">
  <div class="app-loading-mark">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none">
      <path d="M4 6h11M4 12h7M4 18h11" stroke="#1a0d05" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 4 L22 4 L20 13 L20 20 Q20 21 19 21 Q18 21 18 20 L18 13 Z" fill="#1a0d05"/>
    </svg>
  </div>
  <div class="app-loading-text">GustoGrid</div>
  <div class="app-loading-sub">Loading kitchen…</div>
</div>

<!-- React mount point -->
<div id="root"></div>

<!-- Recipe data layer (loaded before React for real counts + search) -->
<script src="./data/recipes.js"></script>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    leaf: <><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19.5 2c.5 5 .5 10.5-1 14"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></>,
    drumstick: <><path d="M15.4 15.63a7.875 6 0 1 1 6.23-6.23 4.5 4.5 0 0 0-6.23 6.23z"/><path d="m8.29 12.71-2.6 2.6a2.5 2.5 0 1 0-1.65 4.65A2.5 2.5 0 1 0 8.7 18.3l2.59-2.59"/></>,
    wine: <><path d="M8 22h8"/><path d="M7 10h10"/><path d="M12 15v7"/><path d="M12 15a5 5 0 0 0 5-5V3H7v7a5 5 0 0 0 5 5z"/></>,
    bowl: <><path d="M3 11h18a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8z"/><path d="M12 11V3"/><path d="M8 6c0-1 .8-3 4-3s4 2 4 3"/></>,
    cake: <><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/></>,
    sparkles: <><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></>,
    glass: <><path d="m9 2 1 6 2 13 2-13 1-6"/><path d="M9 2h6"/></>,
    download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>,
    x: <><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
  };
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
      {paths[name]}
    </svg>
  );
};

// === Categories data ===
// Pull live counts from the data layer
const getCount = (cat) => {
  if (typeof window.GG_GET_BY_CATEGORY === 'function') {
    return window.GG_GET_BY_CATEGORY(cat).length;
  }
  return 0;
};

const categories = [
  { key: 'veg', name: 'Vegetarian', tag: 'Starters · Mains · Sides', icon: 'leaf', count: getCount('veg'), cls: 'c-veg', href: './category.html?cat=veg' },
  { key: 'non', name: 'Non-Veg', tag: 'Poultry · Seafood · Meat', icon: 'drumstick', count: getCount('non'), cls: 'c-non', href: './category.html?cat=non' },
  { key: 'con', name: 'Continental', tag: 'European classics', icon: 'wine', count: getCount('con'), cls: 'c-con', href: './category.html?cat=con' },
  { key: 'chi', name: 'Chinese', tag: 'Noodles · Gravies · Dim sum', icon: 'bowl', count: getCount('chi'), cls: 'c-chi', href: './category.html?cat=chi' },
  { key: 'des', name: 'Desserts', tag: 'Cakes · Sweets · Puddings', icon: 'cake', count: getCount('des'), cls: 'c-des', href: './category.html?cat=des' },
  { key: 'sna', name: 'Snacks', tag: 'Street food · Quick bites', icon: 'sparkles', count: getCount('sna'), cls: 'c-sna', href: './category.html?cat=sna' },
  { key: 'dri', name: 'Drinks', tag: 'Juices · Mocktails · Shakes', icon: 'glass', count: getCount('dri'), cls: 'c-dri', href: './category.html?cat=dri' },
];

const TOTAL_DISHES = categories.reduce((sum, c) => sum + c.count, 0);

// === Install prompt hook ===
const useInstallPrompt = () => {
  const [installEvent, setInstallEvent] = useState(null);
  const [dismissed, setDismissed] = useState(() =>
    typeof localStorage !== 'undefined' && localStorage.getItem('gg-install-dismissed') === '1'
  );

  useEffect(() => {
    const handler = (e) => {
      e.preventDefault();
      setInstallEvent(e);
    };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  const install = async () => {
    if (!installEvent) return;
    installEvent.prompt();
    const result = await installEvent.userChoice;
    if (result.outcome === 'accepted') setInstallEvent(null);
  };

  const dismiss = () => {
    try { localStorage.setItem('gg-install-dismissed', '1'); } catch {}
    setDismissed(true);
  };

  return { canInstall: !!installEvent && !dismissed, install, dismiss };
};

// === Home Screen ===
// Read fridge from localStorage
const loadFridge = () => {
  try {
    const raw = localStorage.getItem('gg-fridge');
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
};

// === Search Overlay ===
const SearchOverlay = ({ onClose }) => {
  const [query, setQuery] = useState('');
  const inputRef = React.useRef(null);

  // Auto-focus the input when overlay opens
  useEffect(() => {
    inputRef.current && inputRef.current.focus();
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = ''; };
  }, []);

  // Filter the recipes
  const results = React.useMemo(() => {
    if (!query.trim() || !window.GG_RECIPES) return [];
    const q = query.toLowerCase().trim();
    return Object.values(window.GG_RECIPES)
      .filter(r => {
        const hay = `${r.title} ${r.sub || ''} ${r.cuisine || ''} ${r.subcat || ''}`.toLowerCase();
        return hay.includes(q);
      })
      .slice(0, 40);
  }, [query]);

  return (
    <div className="search-overlay" onClick={(e) => { if (e.target.classList.contains('search-overlay')) onClose(); }}>
      <div className="search-panel">
        <div className="search-input-row">
          <Icon name="search" style={{color: 'var(--text-3)'}}/>
          <input
            ref={inputRef}
            type="text"
            className="search-input"
            placeholder="Search 228 recipes…"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            autoComplete="off"
          />
          <button className="search-close" onClick={onClose} aria-label="Close">
            <Icon name="x"/>
          </button>
        </div>
        <div className="search-results">
          {query.trim() === '' ? (
            <div className="search-hint">
              <p>Type to search across all 228 recipes</p>
              <p className="search-hint-sub">Try: <em>paneer</em>, <em>biryani</em>, <em>cake</em>, <em>noodles</em>, <em>juice</em></p>
            </div>
          ) : results.length === 0 ? (
            <div className="search-hint">
              <p>No matches for "<em>{query}</em>"</p>
              <p className="search-hint-sub">Try a different ingredient or dish name</p>
            </div>
          ) : (
            <>
              <div className="search-result-count">{results.length} result{results.length === 1 ? '' : 's'}</div>
              {results.map(r => (
                <a key={r.id} className="search-result" href={`./recipe.html?id=${r.id}`}>
                  <div className="sr-thumb" style={{background: r.heroGradient}}>
                    <span className="sr-em">{r.emoji}</span>
                  </div>
                  <div className="sr-body">
                    <div className="sr-title">{r.title}</div>
                    <div className="sr-sub">{r.sub}</div>
                    <div className="sr-meta">
                      <span className="sr-pill">{r.cuisine}</span>
                      <span className="sr-pill">{r.totalMin}m</span>
                      <span className={`sr-pill diff-${r.difficulty}`}>{r.difficulty}</span>
                    </div>
                  </div>
                </a>
              ))}
            </>
          )}
        </div>
      </div>
    </div>
  );
};

const HomeScreen = () => {
  const { canInstall, install, dismiss } = useInstallPrompt();
  const [fridge] = useState(loadFridge);
  const fridgeCount = fridge.length;
  const [searchOpen, setSearchOpen] = useState(false);

  return (
    <div className="app-container fade-up">
      <div className="safe-top"/>

      <div className="h-top">
        <div className="greeting">
          <div className="eyebrow-row">
            <span className="dot"></span>
            <span className="small">{new Date().toLocaleDateString('en-US', { weekday: 'short' })} · {new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true })}</span>
          </div>
          <h2 className="name">Evening, <em>Chef</em></h2>
        </div>
        <div className="avatar">C</div>
      </div>

      <div className="search-bar" onClick={() => setSearchOpen(true)}>
        <Icon name="search"/>
        <span className="placeholder">Search dishes, ingredients, ideas…</span>
        <div className="mic"><Icon name="mic"/></div>
      </div>

      {searchOpen && <SearchOverlay onClose={() => setSearchOpen(false)}/>}

      <a href="./fridge.html" className="fridge-hero">

            </div>
            <h3 className="fridge-hero-title">What's in your <em>fridge</em>?</h3>
            <p className="fridge-hero-sub">Tap what you have. We'll surface recipes you can cook right now.</p>
          </div>
          <div className="fridge-hero-cta">
            <Icon name="arrowUpRight"/>
          </div>
        </div>
        <div className="hero-stat-row">
          <div className="hero-stat">
            <div className="v">{fridgeCount}</div>
            <div className="l">In your fridge</div>
          </div>
          <div className="hero-stat">
            <div className="v">{TOTAL_DISHES}</div>
            <div className="l">Recipes ready</div>
          </div>
          <div className="hero-stat">
            <div className="v">7</div>
            <div className="l">Categories</div>
          </div>

      </a>

      <div className="section-head">

      <div className="cat-grid">

            <div className="glyph"><Icon name={c.icon}/></div>

              <div className="num">{String(i + 1).padStart(2, '0')} / {c.count} dishes</div>
              <div className="name">{c.name}</div>
              <div className="tag">{c.tag}</div>

      {canInstall && (
        <div className="install-prompt">
          <div className="install-prompt-icon"><Icon name="download"/></div>
          <div className="install-prompt-text">
            <div className="a">Install GustoGrid</div>
            <div className="b">Works offline · home-screen icon</div>
          </div>
          <button className="install-prompt-btn" onClick={install}>Install</button>
          <button className="install-prompt-close" onClick={dismiss}><Icon name="x"/></button>
        </div>
      )}

      <nav className="tabbar">
        <a className="tab active" href="./index.html"><Icon name="home"/><span className="tab-lbl">Home</span></a>
        <a className="tab" href="./fridge.html"><Icon name="fridge"/><span className="tab-lbl">Fridge</span></a>
        <a className="tab" href="./saved.html"><Icon name="bookmark"/><span className="tab-lbl">Saved</span></a>
        <a className="tab" href="./creations.html"><Icon name="book"/><span className="tab-lbl">Create</span></a>
        <a className="tab" href="./profile.html"><Icon name="user"/><span className="tab-lbl">Profile</span></a>
      </nav>
    </div>
  );
};

// === Mount + remove loader ===
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HomeScreen/>);

requestAnimationFrame(() => {
  const loader = document.getElementById('app-loading');
  if (loader) {
    loader.classList.add('fade-out');
    setTimeout(() => loader.remove(), 400);
  }
});
</script>
