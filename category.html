<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Browse — GustoGrid</title>
<meta name="description" content="Browse recipes by category with smart sorting and fridge-match filtering.">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FF3D5A">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GustoGrid">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./theme.css">

<style>
  .cat-hero {
    position: relative;
    height: 240px;
    overflow: hidden;
    background: linear-gradient(160deg, #4D1F26 0%, #8A2A35 40%, #FF3D5A 100%);
    padding-top: var(--safe-top);
  }
  .cat-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 35%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.25) 0%, transparent 50%);
  }
  .hero-deco {
    position: absolute;
    right: -40px;
    bottom: -40px;
    width: 240px;
    height: 240px;
    z-index: 1;
    opacity: 0.35;
  }
  .hero-fade {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 70px;
    background: linear-gradient(180deg, transparent, var(--bg));
    z-index: 2;
  }
  .hero-nav {
    position: relative;
    top: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 10;
  }
  .hero-btn {
    width: 40px; height: 40px;
    background: rgba(10,10,11,0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
  }
  .hero-btn svg { width: 18px; height: 18px; color: var(--text); }
  .hero-content {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 90px;
    z-index: 3;
  }
  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(10,10,11,0.45);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 100px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: white;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .hero-eyebrow .dot {
    width: 5px; height: 5px;
    background: var(--mint);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--mint);
  }
  .hero-title {
    font-family: 'Fraunces', serif;
    font-size: 42px;
    font-weight: 400;
    line-height: 0.92;
    letter-spacing: -0.035em;
    color: white;
    margin: 0;
  }
  .hero-title em { font-style: italic; color: #FFD4DA; }
  .hero-tag {
    margin: 10px 0 0;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    max-width: 280px;
    line-height: 1.4;
  }

  .stats-strip {
    margin: -36px 20px 0;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    position: relative;
    z-index: 4;
    box-shadow: 0 16px 40px -16px rgba(0,0,0,0.6);
  }
  .ss-item { text-align: center; position: relative; }
  .ss-item + .ss-item::before {
    content: '';
    position: absolute;
    left: 0; top: 6px; bottom: 6px;
    width: 1px;
    background: var(--border);
  }
  .ss-val {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
  }
  .ss-val em {
    font-style: italic;
    background: linear-gradient(135deg, #FF3D5A, #FF6B35);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .ss-lbl {
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .fridge-banner {
    margin: 20px 20px 0;
    padding: 12px 14px;
    background: linear-gradient(135deg, rgba(61,220,151,0.08), rgba(77,212,255,0.04));
    border: 1px solid rgba(61,220,151,0.2);
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .fridge-banner.active {
    background: linear-gradient(135deg, rgba(61,220,151,0.15), rgba(77,212,255,0.06));
    border-color: rgba(61,220,151,0.4);
  }
  .fb-icon {
    width: 32px; height: 32px;
    background: rgba(61,220,151,0.15);
    border: 1px solid rgba(61,220,151,0.3);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .fb-icon svg { width: 14px; height: 14px; color: var(--mint); }
  .fb-text { flex: 1; min-width: 0; }
  .fb-text .a { font-size: 12px; font-weight: 500; color: var(--text); }
  .fb-text .b {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.05em;
    margin-top: 1px;
  }
  .fb-toggle {
    width: 38px; height: 22px;
    background: var(--surface-2);
    border-radius: 100px;
    position: relative;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .fb-toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: var(--text-3);
    border-radius: 50%;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .fridge-banner.active .fb-toggle {
    background: linear-gradient(135deg, #3DDC97, #1F9E6E);
    border-color: transparent;
  }
  .fridge-banner.active .fb-toggle::after {
    left: 18px;
    background: white;
  }

  .chips-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 20px 20px 4px;
  }
  .sub-chip {
    flex-shrink: 0;
    padding: 9px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-2);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .sub-chip.active {
    background: linear-gradient(135deg, #FF3D5A, #C92A47);
    color: white;
    border-color: transparent;
  }
  .sub-chip .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    opacity: 0.7;
  }

  .sort-bar {
    margin: 16px 20px 0;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .sort-trigger-wrap { position: relative; }
  .sort-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 11px;
    color: var(--text);
  }
  .sort-trigger svg { width: 11px; height: 11px; color: var(--orange); }
  .sort-trigger .label {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-3);
    font-size: 10px;
    letter-spacing: 0.05em;
  }
  .sort-trigger .current {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--orange);
    font-size: 12px;
    font-weight: 500;
  }
  .sort-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    width: 180px;
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: 14px;
    padding: 6px;
    z-index: 100;
    box-shadow: 0 16px 40px -8px rgba(0,0,0,0.6);
    animation: sort-in 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes sort-in {
    from { opacity: 0; transform: translateY(-4px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .sort-opt {
    padding: 9px 12px;
    border-radius: 9px;
    font-size: 12px;
    color: var(--text-2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sort-opt.active {
    color: var(--text);
    background: linear-gradient(135deg, rgba(255,107,53,0.1), rgba(255,194,51,0.05));
  }
  .sort-opt .ck { width: 14px; height: 14px; opacity: 0; color: var(--orange); }
  .sort-opt.active .ck { opacity: 1; }

  .view-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
  }
  .vt-btn {
    width: 28px; height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .vt-btn svg { width: 13px; height: 13px; color: var(--text-3); }
  .vt-btn.active { background: linear-gradient(135deg, #FF6B35, #E8A53D); }
  .vt-btn.active svg { color: #1a0d05; }

  .featured {
    margin: 20px 20px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .featured-img {
    height: 140px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #4D1F26 0%, #A82E3A 50%, #FF6B35 100%);
  }
  .featured-img::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 75% 30%, rgba(255,255,255,0.2), transparent 50%),
      radial-gradient(circle at 25% 80%, rgba(0,0,0,0.25), transparent 60%);
  }
  .featured-emoji {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    line-height: 1;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
    z-index: 1;
  }
  .featured-eyebrow {
    position: absolute;
    top: 12px; left: 12px;
    padding: 5px 10px;
    background: rgba(10,10,11,0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 100px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: white;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .featured-body { padding: 16px; }
  .featured-title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .featured-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0;
    flex: 1;
  }
  .featured-title em { font-style: italic; }
  .featured-sub {
    font-size: 12px;
    color: var(--text-2);
    margin: 0 0 12px;
    line-height: 1.4;
  }
  .meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .meta-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    background: var(--surface-2);
    border-radius: 7px;
    font-size: 11px;
    color: var(--text-2);
    font-weight: 500;
  }
  .meta-pill svg { width: 10px; height: 10px; color: var(--text-3); }
  .meta-pill.diff-easy { color: var(--mint); }
  .meta-pill.diff-easy svg { color: var(--mint); }
  .meta-pill.diff-medium { color: var(--amber); }
  .meta-pill.diff-medium svg { color: var(--amber); }
  .meta-pill.diff-hard { color: var(--crimson); }
  .meta-pill.diff-hard svg { color: var(--crimson); }

  .match-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    background: linear-gradient(135deg, rgba(61,220,151,0.18), rgba(77,212,255,0.1));
    border: 1px solid rgba(61,220,151,0.35);
    border-radius: 7px;
    font-size: 11px;
    font-weight: 600;
    color: var(--mint);
    font-family: 'JetBrains Mono', monospace;
  }

  .section-head {
    padding: 28px 20px 14px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .section-head h3 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
    margin: 0;
  }
  .section-head h3 em { font-style: italic; color: var(--crimson); }
  .section-head .ct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-3);
  }
  .section-head .ct .n { color: var(--text); }

  .list-wrap {
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .list-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-decoration: none;
    color: inherit;
  }
  .list-card:active { transform: scale(0.98); }
  .list-card.high-match {
    border-color: rgba(61,220,151,0.3);
    background: linear-gradient(135deg, rgba(61,220,151,0.04), transparent);
  }
  .lc-thumb {
    width: 76px; height: 76px;
    border-radius: 14px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lc-thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 50%),
      radial-gradient(circle at 70% 80%, rgba(0,0,0,0.2), transparent 50%);
  }
  .lc-thumb .em {
    font-size: 38px;
    line-height: 1;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.4));
    z-index: 1;
  }

  .t-pou-1 { background: linear-gradient(135deg, #4D1F26, #FF6B35); }
  .t-pou-2 { background: linear-gradient(135deg, #5C2818, #E8A53D); }
  .t-pou-3 { background: linear-gradient(135deg, #4D1F26, #FF3D5A); }
  .t-pou-4 { background: linear-gradient(135deg, #4D421F, #FFC233); }
  .t-pou-5 { background: linear-gradient(135deg, #3D1F1F, #A82E3A); }
  .t-pou-6 { background: linear-gradient(135deg, #5C3818, #FFA033); }
  .t-sea-1 { background: linear-gradient(135deg, #1F3D4D, #4DD4FF); }
  .t-sea-2 { background: linear-gradient(135deg, #1F4D3D, #3DDC97); }
  .t-sea-3 { background: linear-gradient(135deg, #2A1F4D, #B97BFF); }
  .t-sea-4 { background: linear-gradient(135deg, #1F3D4D, #5DBBDC); }
  .t-sea-5 { background: linear-gradient(135deg, #1F4D4D, #4DD4FF); }
  .t-mea-1 { background: linear-gradient(135deg, #2D1A1A, #8C2A35); }
  .t-mea-2 { background: linear-gradient(135deg, #3D1F1F, #C92A47); }
  .t-mea-3 { background: linear-gradient(135deg, #2A1F2D, #B97BFF); }
  .t-mea-4 { background: linear-gradient(135deg, #2D1A1A, #6A1F2D); }
  .t-mea-5 { background: linear-gradient(135deg, #3D1F26, #A82E3A); }
  .t-sta-1 { background: linear-gradient(135deg, #4D3D1F, #FFC233); }
  .t-sta-2 { background: linear-gradient(135deg, #4D421F, #FFA033); }

  .lc-body { flex: 1; min-width: 0; }
  .lc-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin: 0 0 3px;
  }
  .lc-sub {
    font-size: 11px;
    color: var(--text-2);
    margin: 0 0 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lc-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .lc-meta-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 7px;
    background: var(--surface-2);
    border-radius: 6px;
    font-size: 10px;
    color: var(--text-2);
    font-weight: 500;
    font-family: 'JetBrains Mono', monospace;
  }
  .lc-meta-pill svg { width: 9px; height: 9px; color: var(--text-3); }
  .lc-meta-pill.cost { color: var(--orange); }
  .lc-meta-pill.diff-Easy { color: var(--mint); }
  .lc-meta-pill.diff-Medium { color: var(--amber); }
  .lc-meta-pill.diff-Hard { color: var(--crimson); }

  .lc-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    align-self: stretch;
    justify-content: space-between;
    padding: 2px 0;
  }
  .lc-match {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 7px;
    background: rgba(61,220,151,0.12);
    border: 1px solid rgba(61,220,151,0.3);
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    color: var(--mint);
  }
  .lc-match.mid {
    background: rgba(255,194,51,0.1);
    border-color: rgba(255,194,51,0.3);
    color: var(--amber);
  }
  .lc-bookmark {
    width: 26px; height: 26px;
    background: var(--surface-2);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .lc-bookmark svg { width: 12px; height: 12px; color: var(--text-3); }
  .lc-bookmark.saved svg { color: var(--amber); fill: var(--amber); }

  .grid-wrap {
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .grid-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .grid-card .gc-img {
    aspect-ratio: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .grid-card .gc-img::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), transparent 50%),
      radial-gradient(circle at 70% 80%, rgba(0,0,0,0.25), transparent 50%);
  }
  .grid-card .gc-em {
    font-size: 56px;
    line-height: 1;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    z-index: 1;
  }
  .grid-card .gc-body { padding: 12px; }
  .grid-card .gc-title {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin: 0 0 6px;
    min-height: 32px;
  }
  .grid-card .gc-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--text-3);
    font-family: 'JetBrains Mono', monospace;
  }
  .grid-card .gc-meta .dot {
    width: 3px; height: 3px;
    background: var(--text-3);
    border-radius: 50%;
  }
  .grid-card .gc-match {
    position: absolute;
    top: 8px; right: 8px;
    padding: 3px 7px;
    background: rgba(10,10,11,0.7);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(61,220,151,0.4);
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

const Icon = ({ name, ...props }) => {

    chevLeft: <><path d="m15 18-6-6 6-6"/></>,

    bookmarkFilled: <><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" fill="currentColor"/></>,

    star: <><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></>,
    rotate: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>,
    home: <><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
    book: <><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></>,

  return (

};

const HeroDeco = () => (
  <svg viewBox="0 0 240 240" fill="none">

    </defs>
    <circle cx="120" cy="120" r="90" stroke="url(#hd-grad)" strokeWidth="1" fill="none"/>
    <circle cx="120" cy="120" r="60" stroke="url(#hd-grad)" strokeWidth="1" fill="none"/>
    <circle cx="120" cy="120" r="30" stroke="url(#hd-grad)" strokeWidth="1" fill="none"/>
    <line x1="0" y1="120" x2="240" y2="120" stroke="white" strokeOpacity="0.1" strokeWidth="1"/>
    <line x1="120" y1="0" x2="120" y2="240" stroke="white" strokeOpacity="0.1" strokeWidth="1"/>

);

// === Data ===
// Per-category metadata. Subcats are dynamically counted from actual recipes.
const CATEGORIES = {
  non: {
    name: 'Non-Vegetarian', display: ['Non-', 'Vegetarian'],
    tagline: 'Poultry, seafood, and red meat — globally inspired',
    accentColor: 'var(--crimson)',
    heroGradient: 'linear-gradient(160deg, #4D1F26 0%, #8A2A35 40%, #FF3D5A 100%)',
    titleEmHex: '#FFD4DA',
    subcatOrder: ['poultry', 'seafood', 'meat', 'starters'],
    subcatLabels: { poultry: 'Poultry', seafood: 'Seafood', meat: 'Meat', starters: 'Starters' },
  },
  veg: {
    name: 'Vegetarian', display: ['Veg', 'etarian'],
    tagline: 'Indian and global vegetarian dishes',
    accentColor: 'var(--mint)',
    heroGradient: 'linear-gradient(160deg, #1F4D2E 0%, #2A7A4E 40%, #3DDC97 100%)',
    titleEmHex: '#B8F0D4',
    subcatOrder: ['Mains', 'Curries', 'Starters', 'Rice', 'Breads', 'Sides'],
    subcatLabels: null,
  },
  con: {
    name: 'Continental', display: ['Conti', 'nental'],
    tagline: 'European classics — pastas, pizzas, mains',
    accentColor: 'var(--amber)',
    heroGradient: 'linear-gradient(160deg, #4D3D1F 0%, #8A6A2A 40%, #E8A53D 100%)',
    titleEmHex: '#FFE4A8',
    subcatOrder: ['Pasta', 'Pizza', 'Mains', 'Salads', 'Soups', 'Sides'],
    subcatLabels: null,
  },
  chi: {
    name: 'Chinese', display: ['Chin', 'ese'],
    tagline: 'Noodles, gravies, dim sum — Indo-Chinese fusion',
    accentColor: 'var(--orange)',
    heroGradient: 'linear-gradient(160deg, #4D1F1F 0%, #8A3A1F 40%, #FF6B35 100%)',
    titleEmHex: '#FFD4B8',
    subcatOrder: ['Noodles', 'Rice', 'Gravies', 'Starters', 'Soups', 'Dim Sum'],
    subcatLabels: null,
  },
  des: {
    name: 'Desserts', display: ['Des', 'serts'],
    tagline: 'Cakes, Indian sweets, frozen treats, pastries',
    accentColor: 'var(--pink)',
    heroGradient: 'linear-gradient(160deg, #3D1F4D 0%, #8A4A8C 40%, #FF6FB5 100%)',
    titleEmHex: '#FFD4E8',
    subcatOrder: ['Indian Sweets', 'Cakes', 'Frozen', 'Pastries', 'Puddings'],
    subcatLabels: null,
  },
  sna: {
    name: 'Snacks', display: ['Sn', 'acks'],
    tagline: 'Street food, quick bites, sandwiches, wraps',
    accentColor: 'var(--amber)',
    heroGradient: 'linear-gradient(160deg, #4D421F 0%, #8A7A2A 40%, #FFC233 100%)',
    titleEmHex: '#FFE89A',
    subcatOrder: ['Street Food', 'Fried', 'Sandwiches', 'Wraps', 'Bites'],
    subcatLabels: null,
  },
  dri: {
    name: 'Drinks', display: ['Dr', 'inks'],
    tagline: 'Juices, mocktails, shakes, hot drinks',
    accentColor: 'var(--cyan)',
    heroGradient: 'linear-gradient(160deg, #1F3D4D 0%, #2A6A8C 40%, #4DD4FF 100%)',
    titleEmHex: '#B8E8FF',
    subcatOrder: ['Shakes', 'Smoothies', 'Juices', 'Coolers', 'Mocktails', 'Hot Drinks'],
    subcatLabels: null,
  },
};

// Read ?cat= from URL
const URL_PARAMS = new URLSearchParams(window.location.search);
const ACTIVE_CAT = URL_PARAMS.get('cat') || 'non';
const CATEGORY = CATEGORIES[ACTIVE_CAT] || CATEGORIES.non;

const SORT_OPTS = [
  { key: 'popular', label: 'Popular' },
  { key: 'quick', label: 'Fastest' },
  { key: 'cost-low', label: 'Cheapest' },
  { key: 'easy', label: 'Easiest' },
  { key: 'match', label: 'Best match', requiresFridge: true },
];

// Hand-tuned popularity/match for the 18 legacy Non-Veg recipes
const LEGACY_META = {
  'butter-chicken':  { match: 92, popular: 98, featured: true, subcat: 'poultry' },
  'tandoori':        { match: 85, popular: 92, subcat: 'poultry' },
  'tikka-masala':    { match: 88, popular: 95, subcat: 'poultry' },
  'honey-wings':     { match: 70, popular: 88, subcat: 'poultry' },
  'coq-vin':         { match: 45, popular: 72, subcat: 'poultry' },
  'lemon-pepper':    { match: 78, popular: 80, subcat: 'poultry' },
  'garlic-prawns':   { match: 65, popular: 86, subcat: 'seafood' },
  'pan-salmon':      { match: 55, popular: 90, subcat: 'seafood' },
  'goan-fish':       { match: 68, popular: 84, subcat: 'seafood' },
  'shrimp-padthai':  { match: 52, popular: 89, subcat: 'seafood' },
  'tuna-tartare':    { match: 30, popular: 68, subcat: 'seafood' },
  'wellington':      { match: 22, popular: 75, subcat: 'meat' },
  'rogan-josh':      { match: 58, popular: 87, subcat: 'meat' },
  'pork-bao':        { match: 38, popular: 79, subcat: 'meat' },
  'bourguignon':     { match: 40, popular: 78, subcat: 'meat' },
  'lamb-shank':      { match: 50, popular: 82, subcat: 'meat' },
  'chicken-65':      { match: 75, popular: 91, subcat: 'starters' },
  'fish-fingers':    { match: 60, popular: 76, subcat: 'starters' },
};

// Deterministic pseudo-random from id (for stub popularity/match)
const hashId = (id) => {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = ((h << 5) - h) + id.charCodeAt(i) | 0;
  return Math.abs(h);
};

// Read fridge from localStorage — used for real match computation
const loadFridge = () => {
  try {
    const raw = localStorage.getItem('gg-fridge');
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
};
const FRIDGE = loadFridge().map(item => String(item).toLowerCase());

// Compute fridge-match for ANY recipe (deep or stub).
// For deep recipes: count ingredients in fridge / total ingredients.
// For stubs: heuristic — count fridge items mentioned in title+sub.
const computeMatch = (r) => {
  if (FRIDGE.length === 0) {
    // No fridge → pseudo-random for sortable variety
    return 30 + (hashId(r.id) % 60);
  }
  if (r.ingredients && r.ingredients.length) {
    // Deep recipe: exact ingredient match
    const matched = r.ingredients.filter(ing => {
      const name = ing.name.toLowerCase();
      return FRIDGE.some(f => name.includes(f) || f.includes(name.split(' ')[0]));
    });
    return Math.round((matched.length / r.ingredients.length) * 100);
  }
  // Stub: heuristic from title + sub + subcat
  const text = `${r.title} ${r.sub || ''} ${r.subcat || ''}`.toLowerCase();
  const hits = FRIDGE.filter(f => text.includes(f)).length;
  // Convert hits to a 0-100 score: 0 hits → 20%, each hit adds ~25% up to cap
  if (hits === 0) return 20 + (hashId(r.id) % 25);
  if (hits === 1) return 55 + (hashId(r.id) % 15);
  if (hits === 2) return 75 + (hashId(r.id) % 15);
  return 90 + (hashId(r.id) % 10);
};

// Pull recipes for active category from data layer, normalize shape
const RECIPES = (window.GG_GET_BY_CATEGORY ? window.GG_GET_BY_CATEGORY(ACTIVE_CAT) : []).map(r => {
  const legacy = LEGACY_META[r.id];
  const cost = r.ingredients && r.ingredients.length
    ? Math.round(r.ingredients.reduce((s, i) => s + i.price, 0))
    : (r.baseCost || 0);
  const h = hashId(r.id);
  // Match: legacy override > computed > fallback
  const matchScore = legacy && legacy.match != null && FRIDGE.length === 0
    ? legacy.match
    : computeMatch(r);
  return {
    id: r.id,
    name: r.title,
    sub: r.sub,
    subcat: (legacy && legacy.subcat) || r.subcat || 'starters',
    time: r.totalMin,
    cost,
    cal: (r.nutrition && r.nutrition.calories) || 0,
    difficulty: r.difficulty,
    emoji: r.emoji,
    heroGradient: r.heroGradient,
    match: matchScore,
    popular: (legacy && legacy.popular) != null ? legacy.popular : 50 + (h % 45),
    featured: (legacy && legacy.featured) || false,
    isStub: r.isStub || false,
  };
});

// Build SUBCATS dynamically by counting actual recipes
const SUBCAT_COUNTS = { all: RECIPES.length };
RECIPES.forEach(r => { SUBCAT_COUNTS[r.subcat] = (SUBCAT_COUNTS[r.subcat] || 0) + 1; });
const SUBCATS = [
  { key: 'all', label: 'All', count: SUBCAT_COUNTS.all },
  ...CATEGORY.subcatOrder
    .filter(k => SUBCAT_COUNTS[k])
    .map(k => ({
      key: k,
      label: (CATEGORY.subcatLabels && CATEGORY.subcatLabels[k]) || k,
      count: SUBCAT_COUNTS[k],
    })),
];

// Category-level avg stats (computed dynamically)
const AVG_TIME = RECIPES.length ? Math.round(RECIPES.reduce((s, r) => s + r.time, 0) / RECIPES.length) : 0;
const AVG_COST = RECIPES.length ? Math.round(RECIPES.reduce((s, r) => s + r.cost, 0) / RECIPES.length) : 0;
CATEGORY.count = RECIPES.length;
CATEGORY.avgTime = AVG_TIME;
CATEGORY.avgCost = AVG_COST;

const formatTime = (min) => {
  if (min < 60) return `${min}m`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m ? `${h}h ${m}m` : `${h}h`;
};

// Persisted bookmarks
const loadSaved = () => {
  try {
    const raw = localStorage.getItem('gg-bookmarks');
    return raw ? new Set(JSON.parse(raw)) : new Set(['butter-chicken', 'goan-fish']);
  } catch { return new Set(); }
};

const ListCard = ({ r, fridgeMode, saved, onToggleSave }) => {
  const highMatch = fridgeMode && r.match >= 80;
  return (
    <a className={`list-card ${highMatch ? 'high-match' : ''}`} href={`./recipe.html?id=${r.id}`}>
      <div className="lc-thumb" style={{background: r.heroGradient}}>
        <span className="em">{r.emoji}</span>
      </div>
      <div className="lc-body">
        <h4 className="lc-title">{r.name}</h4>
        <p className="lc-sub">{r.sub}</p>
        <div className="lc-meta">
          <div className="lc-meta-pill"><Icon name="clock"/>{formatTime(r.time)}</div>
          <div className="lc-meta-pill cost">₹{r.cost}</div>
          <div className={`lc-meta-pill diff-${r.difficulty}`}><Icon name="flame"/>{r.difficulty}</div>
        </div>
      </div>
      <div className="lc-right">
        <div className={`lc-bookmark ${saved ? 'saved' : ''}`} onClick={(e) => { e.preventDefault(); e.stopPropagation(); onToggleSave(r.id); }}>
          <Icon name={saved ? 'bookmarkFilled' : 'bookmark'}/>
        </div>
        {fridgeMode && (<div className={`lc-match ${r.match < 80 ? 'mid' : ''}`}>{r.match}%</div>)}
      </div>
    </a>
  );
};

const GridCard = ({ r, fridgeMode, saved, onToggleSave }) => (
  <a className="grid-card" href={`./recipe.html?id=${r.id}`}>
    <div className="gc-img" style={{background: r.heroGradient}}>
      <span className="gc-em">{r.emoji}</span>
      {fridgeMode && (<div className={`gc-match ${r.match < 80 ? 'mid' : ''}`}>{r.match}%</div>)}
    </div>
    <div className="gc-body">
      <h4 className="gc-title">{r.name}</h4>
      <div className="gc-meta">
        <span>{formatTime(r.time)}</span>
        <span className="dot"/>
        <span style={{color: 'var(--orange)'}}>₹{r.cost}</span>
        <span className="dot"/>
        <span>{r.difficulty}</span>
      </div>
    </div>
  </a>
);

const FeaturedCard = ({ r, fridgeMode, saved }) => (
  <a className="featured" href={`./recipe.html?id=${r.id}`}>
    <div className="featured-img" style={{background: r.heroGradient}}>
      <div className="featured-eyebrow">
        <Icon name="star" width="9" height="9" style={{color: 'var(--amber)', fill: 'currentColor'}}/> Tonight's pick
      </div>
      <span className="featured-emoji">{r.emoji}</span>
    </div>
    <div className="featured-body">
      <div className="featured-title-row">
        <h3 className="featured-title">{r.name}</h3>
        {fridgeMode && <div className="match-badge">{r.match}% match</div>}
      </div>
      <p className="featured-sub">{r.sub}</p>
      <div className="meta-row">
        <div className="meta-pill"><Icon name="clock"/>{formatTime(r.time)}</div>
        <div className="meta-pill">₹{r.cost}</div>
        <div className={`meta-pill diff-${r.difficulty.toLowerCase()}`}><Icon name="flame"/>{r.difficulty}</div>
      </div>
    </div>
  </a>
);

const CategoryScreen = () => {
  const params = new URLSearchParams(window.location.search);
  const initialFridge = params.get('fridge') === '1';

  const [activeSub, setActiveSub] = useState('all');
  const [activeSort, setActiveSort] = useState(initialFridge ? 'match' : 'popular');
  const [view, setView] = useState('list');
  const [fridgeMode, setFridgeMode] = useState(initialFridge);
  const [sortOpen, setSortOpen] = useState(false);
  const [saved, setSaved] = useState(loadSaved);
  const sortRef = useRef(null);

  useEffect(() => {
    try { localStorage.setItem('gg-bookmarks', JSON.stringify([...saved])); } catch {}
  }, [saved]);

  useEffect(() => {
    const handler = (e) => {
      if (sortRef.current && !sortRef.current.contains(e.target)) setSortOpen(false);
    };
    if (sortOpen) document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [sortOpen]);

  useEffect(() => {
    if (!fridgeMode && activeSort === 'match') setActiveSort('popular');
  }, [fridgeMode, activeSort]);

  const toggleSave = (id) => {
    setSaved(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const filtered = useMemo(() => {
    let result = RECIPES.filter(r => activeSub === 'all' || r.subcat === activeSub);
    const sorters = {
      popular: (a, b) => b.popular - a.popular,
      quick: (a, b) => a.time - b.time,
      'cost-low': (a, b) => a.cost - b.cost,
      easy: (a, b) => {
        const order = { Easy: 0, Medium: 1, Hard: 2 };
        return order[a.difficulty] - order[b.difficulty];
      },
      match: (a, b) => b.match - a.match,
    };
    return [...result].sort(sorters[activeSort] || sorters.popular);
  }, [activeSub, activeSort]);

  const featured = useMemo(() => {
    if (fridgeMode) return [...RECIPES].sort((a, b) => b.match - a.match)[0];
    return RECIPES.find(r => r.featured) || RECIPES[0];
  }, [fridgeMode]);

  const nonFeaturedFiltered = filtered.filter(r => r.id !== featured.id);
  const currentSortLabel = SORT_OPTS.find(o => o.key === activeSort)?.label || 'Popular';

  return (
    <div className="app-container fade-up">
      <div className="cat-hero" style={{background: CATEGORY.heroGradient}}>
        <div className="hero-deco"><HeroDeco/></div>
        <div className="hero-nav">
          <a className="hero-btn" href="./index.html"><Icon name="chevLeft"/></a>
          <div className="hero-btn"><Icon name="search"/></div>
        </div>
        <div className="hero-content">
          <div className="hero-eyebrow"><span className="dot" style={{background: CATEGORY.titleEmHex, boxShadow: `0 0 8px ${CATEGORY.titleEmHex}`}}/>Category</div>
          <h1 className="hero-title">{CATEGORY.display[0]}<em style={{color: CATEGORY.titleEmHex}}>{CATEGORY.display[1]}</em></h1>
          <p className="hero-tag">{CATEGORY.tagline}</p>
        </div>
        <div className="hero-fade"/>
      </div>

      <div className="stats-strip">
        <div className="ss-item">
          <div className="ss-val"><em>{CATEGORY.count}</em></div>
          <div className="ss-lbl">Total dishes</div>
        </div>
        <div className="ss-item">
          <div className="ss-val">{CATEGORY.avgTime}<span style={{fontSize: 12, color: 'var(--text-3)'}}> min</span></div>
          <div className="ss-lbl">Avg cook</div>
        </div>
        <div className="ss-item">
          <div className="ss-val">₹{CATEGORY.avgCost}</div>
          <div className="ss-lbl">Avg cost</div>
        </div>
      </div>

      <div className={`fridge-banner ${fridgeMode ? 'active' : ''}`} onClick={() => setFridgeMode(!fridgeMode)}>
        <div className="fb-icon"><Icon name="fridge"/></div>
        <div className="fb-text">
          <div className="a">Match with your fridge</div>
          <div className="b">{fridgeMode ? '5 ingredients selected · 12 high matches' : 'Tap to enable smart matching'}</div>
        </div>
        <div className="fb-toggle"/>
      </div>

      <div className="chips-row">
        {SUBCATS.map(s => (
          <div
            key={s.key}
            className={`sub-chip ${activeSub === s.key ? 'active' : ''}`}
            onClick={() => setActiveSub(s.key)}>
            {s.label}<span className="count">{s.count}</span>
          </div>
        ))}
      </div>

      <div className="sort-bar">
        <div className="sort-trigger-wrap" ref={sortRef}>
          <div className="sort-trigger" onClick={() => setSortOpen(!sortOpen)}>
            <Icon name="sort"/>
            <span className="label">SORT</span>
            <span className="current">{currentSortLabel}</span>
            <Icon name="chevDown"/>
          </div>
          {sortOpen && (
            <div className="sort-dropdown">
              {SORT_OPTS.map(o => {
                const disabled = o.requiresFridge && !fridgeMode;
                return (
                  <div
                    key={o.key}
                    className={`sort-opt ${activeSort === o.key ? 'active' : ''}`}
                    style={disabled ? {opacity: 0.4, pointerEvents: 'none'} : {}}
                    onClick={() => { setActiveSort(o.key); setSortOpen(false); }}>
                    <span>{o.label}{disabled && ' (fridge)'}</span>
                    <Icon name="check" className="ck"/>
                  </div>
                );
              })}
            </div>
          )}
        </div>
        <div className="view-toggle">
          <div className={`vt-btn ${view === 'list' ? 'active' : ''}`} onClick={() => setView('list')}>
            <Icon name="list"/>
          </div>
          <div className={`vt-btn ${view === 'grid' ? 'active' : ''}`} onClick={() => setView('grid')}>
            <Icon name="grid"/>
          </div>
        </div>
      </div>

      {activeSub === 'all' && (
        <FeaturedCard r={featured} fridgeMode={fridgeMode} saved={saved.has(featured.id)}/>
      )}

      <div className="section-head">
        <h3>
          {activeSub === 'all' ? 'All' : SUBCATS.find(s => s.key === activeSub)?.label} <em>dishes</em>
        </h3>
        <span className="ct"><span className="n">{nonFeaturedFiltered.length}</span> RESULTS</span>
      </div>

      {nonFeaturedFiltered.length === 0 ? (
        <div className="empty-state">
          <div className="em">🤷</div>
          <h4>No dishes match</h4>
          <p>Try clearing filters or switching off fridge mode.</p>
          <button className="empty-clear" onClick={() => { setActiveSub('all'); setFridgeMode(false); }}>
            <Icon name="rotate"/> Reset filters
          </button>
        </div>
      ) : view === 'list' ? (
        <div className="list-wrap">
          {nonFeaturedFiltered.map(r => (
            <ListCard key={r.id} r={r} fridgeMode={fridgeMode} saved={saved.has(r.id)} onToggleSave={toggleSave}/>
          ))}
        </div>
      ) : (
        <div className="grid-wrap">
          {(activeSub === 'all' ? [featured, ...nonFeaturedFiltered] : nonFeaturedFiltered).map(r => (
            <GridCard key={r.id} r={r} fridgeMode={fridgeMode} saved={saved.has(r.id)} onToggleSave={toggleSave}/>
          ))}
        </div>
      )}

      <nav className="tabbar">
        <a className="tab active" href="./index.html"><Icon name="home"/><span className="tab-lbl">Home</span></a>
        <a className="tab" href="./fridge.html"><Icon name="fridge"/><span className="tab-lbl">Fridge</span></a>
        <a className="tab" href="./saved.html"><Icon name="bookmark"/><span className="tab-lbl">Saved</span></a>
        <a className="tab" href="./creations.html"><Icon name="book"/><span className="tab-lbl">Create</span></a>
        <a className="tab" href="./profile.html"><Icon name="user"/><span className="tab-lbl">Profile</span></a>
      </nav>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<CategoryScreen/>);

requestAnimationFrame(() => {
  const loader = document.getElementById('app-loading');
  if (loader) {
    loader.classList.add('fade-out');
    setTimeout(() => loader.remove(), 400);
  }
});
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.warn('[SW] failed:', err));
    });
  }
</script>

</body>
</html>
