<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>What's in my Fridge? — GustoGrid</title>
<meta name="description" content="Tap ingredients you have, instantly see recipes you can cook right now.">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0A0A0B">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GustoGrid">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./theme.css">

<style>
  .f-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 16px;
  }

  .f-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-2);
  }

  .f-heading-block { padding: 8px 24px 20px; }
  .f-heading-block h1 {
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: -0.025em;
    line-height: 1.05;
    color: var(--text);
    margin: 0 0 10px;
  }
  .f-heading-block h1 em {
    font-style: italic;
    background: linear-gradient(135deg, #FF6B35, #FFC233);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .f-heading-block p {
    font-size: 14px;
    color: var(--text-2);
    line-height: 1.5;
    margin: 0;
    max-width: 320px;
  }

  .count-card {
    margin: 0 24px 20px;
    padding: 16px 18px;
    background: linear-gradient(135deg, rgba(255,107,53,0.08), rgba(255,194,51,0.04));
    border: 1px solid rgba(255,107,53,0.2);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .count-card .left { display: flex; align-items: center; gap: 14px; }
  .count-num {
    font-family: 'Fraunces', serif;
    font-size: 42px;
    font-weight: 400;
    line-height: 1;
    background: linear-gradient(135deg, #FF6B35, #FFC233);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-style: italic;
    transition: all 0.3s;
    min-width: 50px;
  }
  .count-meta { display: flex; flex-direction: column; gap: 2px; }
  .count-meta .a { font-size: 14px; font-weight: 500; color: var(--text); }
  .count-meta .b { font-size: 11px; color: var(--text-3); letter-spacing: 0.05em; }
  .reset-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-2);
    cursor: pointer;
    font-family: 'Geist', sans-serif;
  }
  .reset-btn svg { width: 12px; height: 12px; }

  .filter-row {
    display: flex;
    gap: 8px;
    padding: 0 24px 20px;
    overflow-x: auto;
  }
  .filter-chip {
    padding: 9px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-2);
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-chip.active {
    background: linear-gradient(135deg, #FF6B35, #E8A53D);
    color: #1a0d05;
    border-color: transparent;
    box-shadow: 0 4px 12px -4px rgba(255,107,53,0.5);
  }
  .filter-chip .ct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    opacity: 0.7;
  }

  .ing-grid {
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .ing-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 8px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    position: relative;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .ing-chip:active { transform: scale(0.94); }
  .ing-chip .emoji {
    font-size: 30px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  .ing-chip .name {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-2);
    text-align: center;
    line-height: 1.2;
  }
  .ing-chip.sel {
    background: linear-gradient(135deg, rgba(255,107,53,0.12), rgba(255,194,51,0.06));
    border-color: rgba(255,107,53,0.5);
    box-shadow: 0 0 0 1px rgba(255,107,53,0.2), 0 8px 24px -12px rgba(255,107,53,0.5);
  }
  .ing-chip.sel .name { color: var(--text); }
  .ing-chip .checkmark {
    position: absolute;
    top: 6px; right: 6px;
    width: 18px; height: 18px;
    background: linear-gradient(135deg, #FF6B35, #FFC233);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .ing-chip.sel .checkmark { opacity: 1; transform: scale(1); }
  .ing-chip .checkmark svg { width: 11px; height: 11px; color: #1a0d05; stroke-width: 3; }

  .find-cta {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(100px + var(--safe-bottom));
    max-width: 448px;
    margin: 0 auto;
    background: linear-gradient(135deg, #FF6B35, #E8A53D);
    border-radius: 22px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 28;
    cursor: pointer;
    box-shadow: 0 12px 32px -8px rgba(255,107,53,0.5);
    transition: transform 0.2s;
    text-decoration: none;
  }
  .find-cta:active { transform: scale(0.97); }
  .find-cta .l-text { display: flex; flex-direction: column; gap: 2px; }
  .find-cta .l-text .a {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    color: #1a0d05;
    font-style: italic;
    letter-spacing: -0.01em;
  }
  .find-cta .l-text .b {
    font-size: 11px;
    color: rgba(26,13,5,0.7);
    font-weight: 500;
    letter-spacing: 0.05em;
  }
  .find-cta .arrow-btn {
    width: 44px; height: 44px;
    background: rgba(26,13,5,0.9);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .find-cta .arrow-btn svg { color: #FFC233; width: 18px; height: 18px; }

  .find-cta.empty {
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .find-cta.empty .l-text .a { color: var(--text-3); font-style: normal; }
  .find-cta.empty .l-text .b { color: var(--text-3); }
  .find-cta.empty .arrow-btn { background: var(--surface-2); }
  .find-cta.empty .arrow-btn svg { color: var(--text-3); }
</style>
</head>

<body>

<div id="app-loading" class="app-loading">
  <div class="app-loading-mark">
    <svg viewBox="0 0 24 24" width="32" height="32" fill="none">
      <path d="M4 6h11M4 12h7M4 18h11" stroke="#1a0d05" stroke-width="2" stroke-linecap="round"/>
      <path d="M18 4 L22 4 L20 13 L20 20 Q20 21 19 21 Q18 21 18 20 L18 13 Z" fill="#1a0d05"/>
    </svg>
  </div>
  <div class="app-loading-text">GustoGrid</div>
  <div class="app-loading-sub">Opening fridge…</div>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

const Icon = ({ name, ...props }) => {
  const paths = {
    chevLeft: <><path d="m15 18-6-6 6-6"/></>,
    search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
    check: <><polyline points="20 6 9 17 4 12"/></>,
    rotate: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>,
    arrowRight: <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
    home: <><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
    fridge: <><path d="M5 6a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M5 10h14"/><path d="M15 7v6"/><path d="M9 7v6"/></>,
    book: <><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></>,
    bookmark: <><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></>,
    user: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
  };
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
      {paths[name]}
    </svg>
  );
};

const allIngredients = [
  { emoji: '🧅', name: 'Onion', cat: 'veg' },
  { emoji: '🍅', name: 'Tomato', cat: 'veg' },
  { emoji: '🧄', name: 'Garlic', cat: 'veg' },
  { emoji: '🫚', name: 'Ginger', cat: 'veg' },
  { emoji: '🥔', name: 'Potato', cat: 'veg' },
  { emoji: '🥕', name: 'Carrot', cat: 'veg' },
  { emoji: '🫑', name: 'Bell pepper', cat: 'veg' },
  { emoji: '🥬', name: 'Spinach', cat: 'veg' },
  { emoji: '🌶️', name: 'Chili', cat: 'veg' },
  { emoji: '🍗', name: 'Chicken', cat: 'pro' },
  { emoji: '🥩', name: 'Beef', cat: 'pro' },
  { emoji: '🐟', name: 'Fish', cat: 'pro' },
  { emoji: '🦐', name: 'Shrimp', cat: 'pro' },
  { emoji: '🥚', name: 'Eggs', cat: 'pro' },
  { emoji: '🧀', name: 'Cheese', cat: 'dai' },
  { emoji: '🥛', name: 'Milk', cat: 'dai' },
  { emoji: '🧈', name: 'Butter', cat: 'dai' },
  { emoji: '🥥', name: 'Yogurt', cat: 'dai' },
  { emoji: '🍚', name: 'Rice', cat: 'pan' },
  { emoji: '🌾', name: 'Flour', cat: 'pan' },
  { emoji: '🍝', name: 'Pasta', cat: 'pan' },
  { emoji: '🫘', name: 'Lentils', cat: 'pan' },
  { emoji: '🧂', name: 'Salt', cat: 'spi' },
  { emoji: '🌿', name: 'Cumin', cat: 'spi' },
  { emoji: '🟡', name: 'Turmeric', cat: 'spi' },
  { emoji: '⚫', name: 'Pepper', cat: 'spi' },
  { emoji: '🌰', name: 'Cinnamon', cat: 'spi' },
  { emoji: '🍋', name: 'Lemon', cat: 'veg' },
];

const filters = [
  { key: 'all', label: 'All' },
  { key: 'veg', label: 'Veggies' },
  { key: 'pro', label: 'Proteins' },
  { key: 'dai', label: 'Dairy' },
  { key: 'pan', label: 'Pantry' },
  { key: 'spi', label: 'Spices' },
];

// Persisted selection via localStorage
const loadSelected = () => {
  try {
    const raw = localStorage.getItem('gg-fridge');
    return raw ? new Set(JSON.parse(raw)) : new Set(['Onion', 'Tomato', 'Garlic']);
  } catch { return new Set(); }
};

const FridgeScreen = () => {
  const [selected, setSelected] = useState(loadSelected);
  const [activeFilter, setActiveFilter] = useState('all');

  useEffect(() => {
    try { localStorage.setItem('gg-fridge', JSON.stringify([...selected])); } catch {}
  }, [selected]);

  const toggle = (n) => {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(n)) next.delete(n); else next.add(n);
      return next;
    });
  };

  const visible = activeFilter === 'all'
    ? allIngredients
    : allIngredients.filter(i => i.cat === activeFilter);

  const matches = Math.min(36, Math.round(selected.size * 2.4));

  const filterCounts = useMemo(() => {
    const counts = { all: allIngredients.length };
    filters.forEach(f => {
      if (f.key !== 'all') counts[f.key] = allIngredients.filter(i => i.cat === f.key).length;
    });
    return counts;
  }, []);

  return (
    <div className="app-container fade-up">
      <div className="safe-top"/>

      <div className="f-head">
        <a className="icon-btn" href="./index.html"><Icon name="chevLeft"/></a>
        <div className="f-title">Inventory match</div>
        <div className="icon-btn"><Icon name="search"/></div>
      </div>

      <div className="f-heading-block">
        <h1>What's in your <em>fridge</em>?</h1>
        <p>Tap every ingredient you've got on hand — we'll rank dishes by what you can cook right now.</p>
      </div>

      <div className="count-card">
        <div className="left">
          <div className="count-num">{selected.size}</div>
          <div className="count-meta">
            <span className="a">{selected.size === 0 ? 'Nothing selected' : 'ingredients tapped'}</span>
            <span className="b">{matches} dish{matches !== 1 ? 'es' : ''} match · sorted by %</span>
          </div>
        </div>
        {selected.size > 0 && (
          <button className="reset-btn" onClick={() => setSelected(new Set())}>
            <Icon name="rotate"/> Reset
          </button>
        )}
      </div>

      <div className="filter-row">
        {filters.map(f => (
          <div
            key={f.key}
            className={`filter-chip ${activeFilter === f.key ? 'active' : ''}`}
            onClick={() => setActiveFilter(f.key)}>
            {f.label} <span className="ct">{filterCounts[f.key]}</span>
          </div>
        ))}
      </div>

      <div className="ing-grid">
        {visible.map(ing => (
          <div
            key={ing.name}
            className={`ing-chip ${selected.has(ing.name) ? 'sel' : ''}`}
            onClick={() => toggle(ing.name)}>
            <div className="checkmark"><Icon name="check"/></div>
            <div className="emoji">{ing.emoji}</div>
            <div className="name">{ing.name}</div>
          </div>
        ))}
      </div>

      <a className={`find-cta ${selected.size === 0 ? 'empty' : ''}`} href={selected.size > 0 ? './category.html?cat=non&fridge=1' : '#'}>
        <div className="l-text">
          <span className="a">{selected.size === 0 ? 'Tap ingredients to start' : `Find ${matches} recipes`}</span>
          <span className="b">{selected.size === 0 ? 'Match engine waiting' : 'Sorted by match percentage'}</span>
        </div>
        <div className="arrow-btn"><Icon name="arrowRight"/></div>
      </a>

      <nav className="tabbar">
        <a className="tab" href="./index.html"><Icon name="home"/><span className="tab-lbl">Home</span></a>
        <a className="tab active" href="./fridge.html"><Icon name="fridge"/><span className="tab-lbl">Fridge</span></a>
        <a className="tab" href="./saved.html"><Icon name="bookmark"/><span className="tab-lbl">Saved</span></a>
        <a className="tab" href="./creations.html"><Icon name="book"/><span className="tab-lbl">Create</span></a>
        <a className="tab" href="./profile.html"><Icon name="user"/><span className="tab-lbl">Profile</span></a>
      </nav>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FridgeScreen/>);

requestAnimationFrame(() => {
  const loader = document.getElementById('app-loading');
  if (loader) {
    loader.classList.add('fade-out');
    setTimeout(() => loader.remove(), 400);
  }
});
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.warn('[SW] failed:', err));
    });
  }
</script>

</body>
</html>
